<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tipping — box fraise</title>
  <meta name="description" content="Places in Edmonton with no way to leave a tip.">
  <meta name="theme-color" content="#ffffff">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:     #ffffff;
      --ink:    #1a1a1a;
      --rule:   #e6e6e6;
      --muted:  #666666;
      --accent: #b21b1b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Newsreader', Georgia, serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    main { max-width: 1140px; margin: 0 auto; padding: 56px 24px 96px; width: 100%; }
    .backlink {
      font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--muted); text-decoration: none;
      display: inline-block; margin-bottom: 48px;
      transition: color 120ms ease;
    }
    .backlink:hover { color: var(--ink); }
    h1 {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(28px, 4.5vw, 52px);
      letter-spacing: -0.025em;
      line-height: 1.05;
      margin: 0 0 28px;
      text-wrap: balance;
    }
    p {
      max-width: 60ch;
      font-size: 18px;
      line-height: 1.65;
      margin: 0 0 18px;
    }

    /* The list. One business per row, name and nothing else unless a
       row needs a note. Empty until there is something true to put
       in it. */
    .list {
      max-width: 60ch;
      margin: 34px 0 0;
      border-top: 2px solid var(--ink);
    }
    .entry {
      border-bottom: 1px solid var(--rule);
      padding: 18px 0;
    }
    .entry-name { font-size: 19px; line-height: 1.3; }
    .entry-note { font-size: 15px; line-height: 1.5; color: var(--muted); margin-top: 5px; }
    .empty {
      border-bottom: 1px solid var(--rule);
      padding: 26px 0;
      font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <a class="backlink" href="/">← box fraise</a>

    <h1>Businesses in Edmonton that do not tip.</h1>

    <p>Places with no way to leave one. No prompt on the machine, no jar, no option.</p>

    <div class="list">
      <div class="empty">No entries yet</div>
    </div>
  </main>
</body>
</html>
