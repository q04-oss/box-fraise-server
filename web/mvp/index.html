<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MVP — box fraise</title>
  <meta name="description" content="Without community, nothing can be built. The scannable advertisement is functioning and out in public.">
  <meta name="theme-color" content="#ffffff">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:     #ffffff;
      --ink:    #1a1a1a;
      --rule:   #e6e6e6;
      --muted:  #666666;
      --accent: #b21b1b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Newsreader', Georgia, serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    main { max-width: 1140px; margin: 0 auto; padding: 56px 24px 96px; width: 100%; }
    .backlink {
      font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--muted); text-decoration: none;
      display: inline-block; margin-bottom: 48px;
      transition: color 120ms ease;
    }
    .backlink:hover { color: var(--ink); }

    /* Same treatment as the homepage statement: runs the width of the
       page rather than sitting in a column. */
    h1 {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(38px, 9vw, 108px);
      letter-spacing: -0.035em;
      line-height: 0.98;
      margin: 0 0 32px;
      text-wrap: balance;
    }
    p {
      max-width: 60ch;
      font-size: clamp(19px, 2.5vw, 24px);
      line-height: 1.5;
      margin: 0;
    }
    a.inline {
      color: var(--ink); text-decoration: underline;
      text-underline-offset: 3px; text-decoration-color: var(--rule);
      transition: text-decoration-color 120ms ease;
    }
    a.inline:hover { text-decoration-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <a class="backlink" href="/">← box fraise</a>

    <h1>Without community, nothing can be built.</h1>

    <p>The <a class="inline" href="/scan">scannable advertisement</a> is functioning and
    out in public.</p>
  </main>
</body>
</html>
