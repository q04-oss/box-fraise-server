<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run club — box fraise</title>
  <!-- The run club page moved to /club, because the nav has always
       called it Club and /club sits next to /clubhouse.
       This is a redirect rather than a deletion for one reason:
       unlike /chat, this page carried no robots meta, has been in the
       homepage nav since before the rename, and is the URL anyone
       telling somebody about the run club would have sent. Deleting it
       breaks those links. -->
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=/club">
  <link rel="canonical" href="/club">
  <style>
    body { font-family: Georgia, serif; margin: 0; padding: 64px 24px; color: #1a1a1a; }
    main { max-width: 460px; margin: 0 auto; }
    p { font-size: 17px; line-height: 1.6; }
    a { color: #b21b1b; }
  </style>
</head>
<body>
  <main>
    <p>The run club is at <a href="/club">/club</a> now.</p>
  </main>
  <script>location.replace('/club');</script>
</body>
</html>
